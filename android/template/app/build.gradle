plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def appIdValue = (project.findProperty('appId') ?: 'com.mrai.webapp').toString()
def orientationValue = (project.findProperty('screenOrientation') ?: 'portrait').toString()

android {
    namespace 'com.mraiprime.webapp'
    compileSdk 35

    defaultConfig {
        applicationId appIdValue
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        manifestPlaceholders = [screenOrientation: orientationValue]
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}